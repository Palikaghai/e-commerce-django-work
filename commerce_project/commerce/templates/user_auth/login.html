{% extends 'base.html' %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; background: #fff; padding: 20px;">
    <div style="width: 100%; max-width: 400px; text-align: center;">
        
        <h2 style="font-size: 2rem; color: #222; margin-bottom: 10px; font-weight: 700; letter-spacing: -1px;">Welcome Back</h2>
        <p style="color: #777; margin-bottom: 40px; font-size: 0.95rem;">Please enter your details to sign in.</p>

        <form method="post" style="text-align: left;">
            {% csrf_token %}
            {% if form.non_field_errors %}
                <div style="color: #f44336; margin-bottom:10px;">{{ form.non_field_errors }}</div>
            {% endif %}
            {{ form.as_p }}
            <input type="hidden" name="next" value="{{ request.GET.next }}">
            <button type="submit" style="width: 100%; background: #222; color: white; padding: 14px; border: none; border-radius: 4px; font-weight: bold; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.3s;" onmouseover="this.style.background='#e91e63'" onmouseout="this.style.background='#222'">
                Sign In
            </button>
        </form>

        <p style="margin-top: 30px; font-size: 0.9rem; color: #777;">
            Don't have an account? <a href="{% url 'signup' %}" style="color: #e91e63; text-decoration: none; font-weight: 600;">Join the Club</a>
        </p>

    </div>
</div>
{% endblock %}
