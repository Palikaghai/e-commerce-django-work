{% extends 'base.html' %}

{% block content %}
<div style="max-width:700px; margin:40px auto; padding:20px; background:#fff; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.04);">
    <h3>Reorder Confirmation</h3>
    <p>Are you sure you want to add items from <strong>Order #{{ order.id }}</strong> back into your cart?</p>
    <form method="post">{% csrf_token %}
        <button type="submit" style="background:#e91e63; color:#fff; border:none; padding:10px 12px; border-radius:8px;">Yes, add to cart</button>
        <a href="{% url 'account_orders' %}" style="margin-left:12px;">Cancel</a>
    </form>
</div>
{% endblock %}
