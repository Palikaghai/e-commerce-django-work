{% extends 'base.html' %}

{% block content %}
<div style="max-width:800px; margin:40px auto; padding:20px; background:#fff; border-radius:12px;">
    <h2>{% if product %}Edit{% else %}Add{% endif %} Product</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background:#e91e63; color:#fff; padding:10px 18px; border:none; border-radius:8px;">Save</button>
    </form>
</div>
{% endblock %}
